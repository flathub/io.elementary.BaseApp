id: io.elementary.BaseApp
runtime: org.gnome.Platform
sdk: org.gnome.Sdk
runtime-version: '49'
branch: circe-25.08
separate-locales: false
cleanup:
  - /cache
  - /man
  - /share/aclocal
  - /share/devhelp
  - /share/gtk-doc
  - /share/man
  - /lib/systemd
  - '*.la'
  - '*.a'
modules:
  - name: sassc
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/sass/sassc/archive/3.6.2.tar.gz
        sha256: 608dc9002b45a91d11ed59e352469ecc05e4f58fc1259fc9a9f5b8f0f8348a03
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -si
    modules:
      - name: libsass
        buildsystem: autotools
        sources:
          - type: archive
            url: https://github.com/sass/libsass/archive/3.6.5.tar.gz
            sha256: 89d8f2c46ae2b1b826b58ce7dde966a176bac41975b82e84ad46b01a55080582
          - type: script
            dest-filename: autogen.sh
            commands:
              - autoreconf -si

  - name: granite
    buildsystem: meson
    cleanup:
      - /bin
      - /share/applications
      - /share/metainfo
    sources:
      - type: git
        url: https://github.com/elementary/granite.git
        tag: 6.2.0
        commit: 4ab145c28bb3db6372fe519e8bd79c645edfcda3
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
          versions:
            <: 7.0.0

  - name: granite-7
    buildsystem: meson
    config-opts:
      - -Ddemo=false
    cleanup:
      - /share/icons
      - /share/metainfo
    sources:
      - type: git
        url: https://github.com/elementary/granite.git
        tag: 7.7.0
        commit: ae94e9123bbf1dea8db38bedd8a925dbd5a8f812
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: elementary-theme
    buildsystem: meson
    cleanup:
      - /share/metainfo
    sources:
      - type: git
        url: https://github.com/elementary/stylesheet.git
        tag: 8.2.2
        commit: 9cfb767873d583f6ed29e96cf27728bb69fd9237
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
    post-install:
      # Fallback "elementary", the theme name before stylesheet 6.0.0, to the blueberry variant
      - ln -s /app/share/themes/io.elementary.stylesheet.blueberry /app/share/themes/elementary

  - name: elementary-icons
    buildsystem: meson
    cleanup:
      - /share/metainfo
    config-opts:
      - -Dpalettes=false
    sources:
      - type: git
        url: https://github.com/elementary/icons.git
        tag: 8.2.0
        commit: 6ddbb535af70a5ceeff5e1fec05d9b0562641b2a
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
    modules:
      - name: xcursorgen
        cleanup:
          - '*'
        sources:
          - type: git
            url: https://gitlab.freedesktop.org/xorg/app/xcursorgen.git
            tag: xcursorgen-1.0.9
            commit: 3d0909b630ca82401489411c9b496de14f664c55
            x-checker-data:
              type: git
              tag-pattern: ^xcursorgen-([\d.]+)$

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Dbackend-qt5=disabled
      - -Dbackend-qt6=disabled
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/flatpak/libportal.git
        tag: 0.9.1
        commit: 8f5dc8d192f6e31dafe69e35219e3b707bde71ce
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
