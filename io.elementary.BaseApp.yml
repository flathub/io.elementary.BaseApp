id: io.elementary.BaseApp
branch: tanit-26.08
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
separate-locales: false
build-options:
  prepend-path: /usr/lib/sdk/vala/bin
  prepend-ld-library-path: /usr/lib/sdk/vala/lib
cleanup:
  - /cache
  - /man
  - /share/aclocal
  - /share/devhelp
  - /share/gtk-doc
  - /share/man
  - /lib/systemd
  - '*.la'
  - '*.a'
modules:
  - name: libgee
    cleanup:
      - '*'
    buildsystem: autotools
    build-options:
      cflags: -Wno-error=incompatible-pointer-types
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee
        x-checker-data:
          type: gnome
          name: libgee

  # libadwaita, granite-7, and stylesheet require the sassc execute file
  - name: sassc
    cleanup:
      - '*'
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/sass/sassc/archive/3.6.2.tar.gz
        sha256: 608dc9002b45a91d11ed59e352469ecc05e4f58fc1259fc9a9f5b8f0f8348a03
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -si
    modules:
      - name: libsass
        cleanup:
          - '*'
        buildsystem: autotools
        sources:
          - type: archive
            url: https://github.com/sass/libsass/archive/3.6.5.tar.gz
            sha256: 89d8f2c46ae2b1b826b58ce7dde966a176bac41975b82e84ad46b01a55080582
          - type: script
            dest-filename: autogen.sh
            commands:
              - autoreconf -si

  - name: gtk4
    buildsystem: meson
    cleanup:
      - /bin
      - /share/bash-completion
      - /share/gettext
      - /share/glib-2.0
      - /share/gtk-4.0
    config-opts:
      - -Dintrospection=enabled
      - -Dbuild-demos=false
      - -Dbuild-testsuite=false
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtk/4.22/gtk-4.22.4.tar.xz
        sha256: 51bd9f60c7d23a665a556c7364c21fb2e4e282566b3e7e092455e8f910330893
        x-checker-data:
          type: gnome
          name: gtk
          stable-only: true
          version-scheme: odd-minor-is-unstable

  - name: libadwaita
    buildsystem: meson
    config-opts:
      - -Dtests=false
      - -Dexamples=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libadwaita/1.9/libadwaita-1.9.3.tar.xz
        sha256: fc59b37028fe0126308e7b805d2f6e4e80227080a1797715e5e6286b8111e723
        x-checker-data:
          type: gnome
          name: libadwaita
    modules:
      - shared-modules/appstream/appstream-compose.json

  - name: granite
    buildsystem: meson
    cleanup:
      # Cleanup unnecessary demo
      - /bin
      - /share/applications
      - /share/metainfo
    sources:
      - type: archive
        url: https://github.com/elementary/granite/archive/6.2.0.tar.gz
        sha256: 067d31445da9808a802fca523630c3e4b84d2d7c78ae547ced017cb7f3b9c6b5
        x-checker-data:
          type: json
          url: https://api.github.com/repos/elementary/granite/releases
          version-query: '[.[] | select(.tag_name | test("^6\\..*$"))] | max_by(.tag_name)
            | .tag_name'
          url-query: '"https://github.com/elementary/granite/archive/" + ([.[] | select(.tag_name
            | test("^6\\..*$"))] | max_by(.tag_name) | .tag_name) + ".tar.gz"'
          timestamp-query: '[.[] | select(.tag_name | test("^6\\..*$"))] | max_by(.tag_name)
            | .published_at'

  - name: granite-7
    buildsystem: meson
    config-opts:
      - -Ddemo=false
    cleanup:
      # Cleanup unnecessary icons that only used in the metainfo
      - /share/icons
      - /share/metainfo
    sources:
      - type: archive
        url: https://github.com/elementary/granite/archive/7.8.1.tar.gz
        sha256: bc8e7946ca091fdeeeebeb64db4e95d33a3ffb879048137f8d8a41ecd76caa3f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/elementary/granite/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/elementary/granite/archive/" + .tag_name
            + ".tar.gz"'
          timestamp-query: .published_at

  - name: stylesheet
    buildsystem: meson
    cleanup:
      - /share/metainfo
    sources:
      - type: archive
        url: https://github.com/elementary/stylesheet/archive/8.2.2.tar.gz
        sha256: b5f016c9e7c528d18bb1fa7a405bc294af336a9d967574a66eb22e5fffb89aa9
        x-checker-data:
          type: json
          url: https://api.github.com/repos/elementary/stylesheet/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/elementary/stylesheet/archive/" + .tag_name
            + ".tar.gz"'
          timestamp-query: .published_at
    post-install:
      # Fallback "elementary", the theme name before stylesheet 6.0.0, to the blueberry variant
      - ln -s /app/share/themes/io.elementary.stylesheet.blueberry /app/share/themes/elementary

  - name: icons
    buildsystem: meson
    cleanup:
      - /share/metainfo
    config-opts:
      - -Dpalettes=false
    sources:
      - type: archive
        url: https://github.com/elementary/icons/archive/9.0.0.tar.gz
        sha256: c8b43a6208145b87355c5d5d3e8b72e35bd1337e8bf76739c6a6e1a691de2b9c
        x-checker-data:
          type: json
          url: https://api.github.com/repos/elementary/icons/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/elementary/icons/archive/" + .tag_name +
            ".tar.gz"'
          timestamp-query: .published_at
    modules:
      - name: xcursorgen
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://xorg.freedesktop.org/archive/individual/app/xcursorgen-1.0.9.tar.xz
            sha256: 0cc9e156ac84ca16ea902710af35e0faffa51d13797071e3b4b6cc7cbd493bbc
            x-checker-data:
              type: anitya
              project-id: 21210
              url-template: https://xorg.freedesktop.org/archive/individual/app/xcursorgen-$version.tar.xz

  - name: libportal
    buildsystem: meson
    config-opts:
      - -Dbackend-qt5=disabled
      - -Dbackend-qt6=disabled
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/flatpak/libportal/archive/0.10.0.tar.gz
        sha256: e1b6913c6d9015bfa918ace86f82c30940982add97aed9c18cc929c5327054fd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/flatpak/libportal/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/flatpak/libportal/archive/" + .tag_name
            + ".tar.gz"'
          timestamp-query: .published_at

  # Cleate a script that apps can clean up development-related files from the BaseApp
  # Inspired from:
  # https://github.com/flathub/io.qt.qtwebengine.BaseApp/blob/e0a292389792523d0f78534bf5597a539a21dc64/io.qt.qtwebengine.BaseApp.json#L97-L134
  - name: cleanup-BaseApp
    buildsystem: simple
    sources:
      - type: script
        dest-filename: cleanup-BaseApp.sh
        commands:
          - rm -rfv ${FLATPAK_DEST}/include
          - rm -rfv ${FLATPAK_DEST}/lib/girepository-1.0
          - rm -rfv ${FLATPAK_DEST}/lib/pkgconfig
          - rm -rfv ${FLATPAK_DEST}/share/gir-1.0
          - rm -rfv ${FLATPAK_DEST}/share/vala
    build-commands:
      - install cleanup-BaseApp.sh -t ${FLATPAK_DEST}
